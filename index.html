<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The app's own --background tokens, light and dark, NOT the brand green
         (#047857) that used to be the single value here. That green is the
         *primary*, not the ground, so a green bar handing off to a white app was
         a visible seam. These two also drive the native splash background
         (capacitor.config.ts) and the status/gesture bars in P3.3 — three
         surfaces, one pair of colours (CAPACITOR-PLAN.md → P2.9). -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1413" />
    <title>Wi-Vendor · Wi-Mall</title>
    <!-- Tab icon. The 32px cut is trimmed to the artwork's bounds so the mark
         still reads at favicon size; the Apple one keeps the source's safe-area
         padding, which iOS expects when it masks the home-screen icon. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      // Paint the stored theme before first paint, otherwise a dark-mode vendor
      // gets a white flash until React mounts. Mirrors StoreProvider's logic.
      (function () {
        try {
          var t = localStorage.getItem('vendor-dash:theme') || 'light';
          var dark =
            t === 'dark' ||
            (t === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
