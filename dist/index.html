    <script>
      // Paint the stored theme before first paint, otherwise a dark-mode vendor
      // gets a white flash until React mounts. Mirrors StoreProvider's logic.
      (function () {
        try {
          var t = localStorage.getItem('vendor-dash:theme') || 'light';
          var dark =
            t === 'dark' ||
            (t === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
