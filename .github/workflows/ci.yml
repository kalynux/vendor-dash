# Checks every push and pull request. Produces no artefact — release.yml does
# that, and only from production.
#
# This is the gate that keeps a main with no test environment meaningful: nothing
# is deployed from main, but nothing broken should be merged into it either, and
# production is branched from it.

name: CI

on:
  push:
    branches: [main, production]
  pull_request:

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ⚠ STILL NON-BLOCKING, AND THE NUMBER IS SMALLER THAN IT WAS. 34 errors on
      #   2026-09-13 before any deployment change; 22 after the pass that day.
      #
      #   What was fixed, and why those twelve were the right twelve:
      #     7  react-refresh in src/components/ui/* — generated shadcn output, which
      #        ships variants and hooks beside the component. The rule is now off for
      #        that directory: satisfying it means hand-editing generated files and
      #        losing regeneration, and the rule only protects dev Fast Refresh.
      #     3  no-unused-vars where the code ALREADY used the leading-underscore
      #        convention and the config did not know it. Config fixed, not code.
      #     2  no-irregular-whitespace — U+00A0 and U+202F written as LITERAL
      #        characters inside a regex in tools/i18n/smoke.ts. Now escapes, which
      #        is the same pattern and actually reviewable. i18n:smoke still passes.
      #
      #   ⚠ THE REMAINING 22 ARE NOT TRIVIAL, WHICH IS WHY THEY ARE STILL HERE:
      #     12 react-refresh in src/store/index.tsx, onboarding.store.tsx and App.tsx.
      #        The fix is the split admin-dash uses (provider in one file, context and
      #        hooks in another) and it changes imports in ~32 files. Mechanical, but
      #        it is a refactor of the state layer of a LIVE app and deserves its own
      #        change rather than riding along with a deployment.
      #     10 react-hooks rules (refs, set-state-in-effect, purity,
      #        preserve-manual-memoization) across product media, the variant table,
      #        the media gallery and the storefront preview. Each is a real finding
      #        about render-time behaviour and each needs its component re-reasoned.
      #
      #   ⚠ MAKE THIS BLOCKING once those land. landing did exactly this sweep on the
      #     same day and reached zero, so its gate is already on — this one is the
      #     remaining half, not an accepted permanent state.
      - name: Lint
        continue-on-error: true
        run: npm run lint

      # ⚠ STILL NON-BLOCKING, BUT FOR A COMPLETELY DIFFERENT REASON THAN BEFORE.
      #
      #   It was failing on SEVEN "hardcoded strings". Six of those were the audit
      #   heuristic misreading CODE as copy: outside JSX, `>` and `<` are comparison
      #   operators, so its `>text<` pattern matched things like
      #   `if (dt > MAX_DURATION_MS) return; if (Math.abs(dx) <`. The seventh was
      #   `placeholder="wi-mall.com/guide"` — user-visible, but a hostname is not
      #   translatable. tools/i18n/audit.mjs now restricts the JSX sweep to .tsx
      #   files and rejects candidates containing `;`/`=>` or shaped like a URL, and
      #   it reports "No hardcoded user-visible strings detected".
      #
      #   ⚠ WHAT IS LEFT IS REAL AND IS NOT A LINT PROBLEM: 33 of 640 backend error
      #     codes have no message, all of them BOT_* or NEGOTIATION_*. A vendor who
      #     hits one sees a generic fallback instead of an explanation. Fixing it
      #     means writing 33 messages in English AND French, in the product's own
      #     voice — copy, not code, and not something to invent on a live
      #     dashboard. Locale parity is already FULL (fr: 4394 keys).
      #
      #   ⚠ MAKE THIS BLOCKING once those 33 have copy. The other two checks this
      #     script runs — locale parity and the i18n smoke test — both pass today.
      - name: i18n audit and smoke test
        continue-on-error: true
        run: npm run i18n:check

      - name: Rich-text contract
        run: npm run richtext:verify

      - name: Mobile auth contract
        run: npm run mobileauth:verify

      # ⚠ THERE IS NO `npm test` IN THIS REPOSITORY. The four checks above are
      #   the guards it actually has — they are not a substitute for a unit suite,
      #   and a green run here is a weaker signal than in admin-dash or
      #   agency-dash. Worth knowing before trusting a tick on a risky change.
      # The production image is built by exactly this command, with WEB_DEPLOY set
      # the way the Dockerfile sets it. Building it here is the cheapest way to
      # catch a Vite-only failure — a bad import, a missing asset, a base-path
      # mistake — on a branch that publishes nothing.
      #
      # ⚠ WEB_DEPLOY=1 MATTERS TO THIS STEP. Without it Vite emits a relative base
      #   and the build still succeeds, so this would pass while the real image
      #   broke every deep link. Setting it here means CI builds the same artefact
      #   the Dockerfile does.
      - name: Production build
        env:
          WEB_DEPLOY: '1'
        run: npm run build
